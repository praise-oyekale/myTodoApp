<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Practice App</title>
    <link rel="stylesheet" href="./icons/fontawesome-free-7.2.0-web/fontawesome-free-7.2.0-web/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="generalContainer">
        <h1>Your To Do</h1>
        <section class="formSection">
            <input type="text" id="inputNewTask" placeholder="Add new task" class="inputNewTask" required>
            <button id="addTodoBtn" class="addTodoBtn"><i class="fa-solid fa-add"></i></button>
        </section>
        <section class="displayTodoSection">
            <div id="display" class="displayScreen">
                <div id="taskContainer" class="taskContainer">
                    <div class="task1">
                        <input type="checkbox" name="todo-checkbox" id="todoCheckbox" class="todoCheckbox">
                        <h4 class="taskTitle" id="taskTitle">This Is An example of Task</h4>
                    </div>
                    <span id="delBtn" class="delBtn"><i class="fa-solid fa-multiply"></i></span>
        
                </div>
            </div>
        </section>
        <section class="endingSection">
            <h6 id="unCompletedList"></h6>
            <p>"Doing what you love is the cornerstone of having abundance in your life"</p>
        </section>
    </div>
    <script src="./script.js"></script>
</body>
</html>
